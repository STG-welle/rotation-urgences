name: Envoi Hebdomadaire Planning WhatsApp (Bot Capture)

on:
  schedule:
    # Dimanche soir à 18h00 UTC = 19h00 heure de Libreville (UTC+1)
    - cron: '0 18 * * 0'
  workflow_dispatch:


permissions:
  contents: read

jobs:
  send-weekly-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 🟢 Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Installer les dépendances
        run: npm install

      - name: 🎭 Installer Playwright et le navigateur Chromium
        run: npx playwright install --with-deps chromium

      - name: 📸 Exécuter le Bot (Capture 2 Équipes & Envoi WhatsApp)
        run: node scripts/send-weekly-planning.js
        env:
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
          GREEN_API_HOST: ${{ secrets.GREEN_API_HOST || 'https://7107.api.greenapi.com' }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://stg-welle.github.io/rotation-urgences/' }}

      - name: 💾 Conserver la capture d'écran comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-semaine-capture
          path: planning-semaine.png
          if-no-files-found: ignore
          retention-days: 14
